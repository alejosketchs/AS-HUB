<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>AS HUB</title>
<meta name="description" content="Tareas y finanzas personales, sincronizadas entre tu celular y tu computador.">
<meta name="theme-color" content="#090b12">
<meta name="color-scheme" content="dark">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AS HUB">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://derzetuipyugmrjaxcyu.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..1000&family=Geist+Mono:wght@400..900&display=swap" rel="stylesheet">
<!-- Si una hoja de estilo no está en este sitio, se pide al espejo.
     Al publicar el repo completo, siempre gana la copia local. -->
<link rel="stylesheet" href="/css/app.css" onerror="this.href='https://as-hub-mods-as24-b7b9.vercel.app/css/app.css'">
<link rel="stylesheet" href="/css/taskgrid.css" onerror="this.href='https://as-hub-mods-as24-b7b9.vercel.app/css/taskgrid.css'">
<link rel="stylesheet" href="/css/finance.css" onerror="this.href='https://as-hub-mods-as24-b7b9.vercel.app/css/finance.css'">
</head>
<body>

<div id="lock" class="lock hide">
  <div class="lockBox">
    <div class="brandBubble" style="width:70px;height:62px;font-size:22px">AS!</div>
    <h1 class="display" style="font-size:34px">AS HUB</h1>
    <p class="muted" style="font-size:13px;font-weight:650">Ingresa tu PIN para entrar</p>
    <div class="lockDots" id="lockDots"><i></i><i></i><i></i><i></i></div>
    <div class="keypad" id="keypad">
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" data-k="reset" style="background:transparent;color:var(--muted);border-color:#ffffff30;box-shadow:none;font-size:11px">RESET</button>
      <button type="button" data-k="0">0</button>
      <button type="button" data-k="del" style="background:transparent;color:var(--text);border-color:#ffffff30;box-shadow:none">⌫</button>
    </div>
  </div>
</div>

<div id="shell" class="hide">
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#/">
        <span class="brandBubble">AS!</span>
        <span class="brandWords"><b>AS HUB</b><i>personal</i></span>
      </a>

      <nav class="navLinks" id="navLinks">
        <a href="#/" data-route="/">Inicio</a>
        <a href="#/tareas" data-route="/tareas">Tareas</a>
        <a href="#/finanzas" data-route="/finanzas">Finanzas</a>
      </nav>

      <div class="row">
        <span class="pill" id="syncPill"><i></i><span id="syncText">SYNC</span></span>
        <button class="iconBtn" id="btnLock" type="button" aria-label="Bloquear">🔒</button>
      </div>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/" data-route="/"><span>◆</span>Inicio</a>
    <a href="#/tareas" data-route="/tareas"><span>✓</span>Tareas</a>
    <a href="#/finanzas" data-route="/finanzas"><span>$</span>Finanzas</a>
  </nav>
</div>

<script type="module" src="/js/app.js"></script>
<noscript><p style="padding:24px;font-family:monospace">AS HUB necesita JavaScript activado.</p></noscript>
</body>
</html>
