<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>AS HUB</title>
<meta name="description" content="Tareas y finanzas personales, sincronizadas entre tu celular y tu computador.">
<meta name="theme-color" content="#090b12">
<meta name="color-scheme" content="dark">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AS HUB">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://derzetuipyugmrjaxcyu.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..1000&family=Geist+Mono:wght@400..900&display=swap" rel="stylesheet">

<!-- Si una hoja de estilo no está en este sitio, se pide al espejo.
     Al publicar el repo completo, siempre gana la copia local. -->
<link rel="stylesheet" href="/css/app.css" onerror="this.href='https://as-hub-mods-as24-b7b9.vercel.app/css/app.css'">
<link rel="stylesheet" href="/css/taskgrid.css" onerror="this.href='https://as-hub-css-as24-b7b9.vercel.app/css/taskgrid.css'">
<link rel="stylesheet" href="/css/finance.css" onerror="this.href='https://as-hub-css-as24-b7b9.vercel.app/css/finance.css'">
</head>
<body>

<!-- Puerta de entrada: perfil + PIN -->
<div id="gate" class="gate hide">
  <div class="gateCard">
    <div class="gateBrand">
      <span class="brandBubble">AS!</span>
      <div><b>AS SUITE</b><i>acceso</i></div>
    </div>
    <div id="gateBox" class="gateBox"></div>
  </div>
</div>

<div id="shell" class="hide">
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#/">
        <span class="brandBubble">AS!</span>
        <span class="brandWords"><b>AS HUB</b><i>personal</i></span>
      </a>

      <nav class="navLinks" id="navLinks">
        <a href="#/" data-route="/">Inicio</a>
        <a href="#/tareas" data-route="/tareas">Tareas</a>
        <a href="#/finanzas" data-route="/finanzas">Finanzas</a>
      </nav>

      <div class="row">
        <span class="pill" id="syncPill"><i></i><span id="syncText">SYNC</span></span>
        <button class="whoBtn" id="btnWho" type="button" aria-label="Sesión">
          <span id="whoEmoji">👤</span><b id="whoName">—</b>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/" data-route="/"><span>◆</span>Inicio</a>
    <a href="#/tareas" data-route="/tareas"><span>✓</span>Tareas</a>
    <a href="#/finanzas" data-route="/finanzas"><span>$</span>Finanzas</a>
  </nav>
</div>

<script type="module" src="/js/app.js"></script>
<noscript><p style="padding:24px;font-family:monospace">AS HUB necesita JavaScript activado.</p></noscript>
</body>
</html>
